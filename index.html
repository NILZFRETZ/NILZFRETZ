<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171b21"><link rel="manifest" href="manifest.json"><title>NILZFRETZ</title><style>body{background:#171b21;color:#eee;font:16px system-ui;margin:16px}h1,h2{color:#eac58b}button,select{background:#303641;color:white;border:1px solid #626975;border-radius:8px;padding:10px;font:inherit}label{display:inline-block;margin:5px}#neck{display:grid;grid-template-columns:repeat(25,44px);width:max-content}#neck button{border-radius:0;height:44px;padding:0;background:#68482f;border:0;border-right:2px solid #bdb1a0;position:relative}#neck button:before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:#ddd}#neck span{position:relative;display:inline-grid;place-items:center;border-radius:50%;width:30px;height:30px;font-size:12px}#neck button:disabled{opacity:.25}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}#result{background:#252b34;padding:16px;border-radius:12px;margin:12px 0}small{color:#bbb}#neck div{text-align:center;padding:6px}button{cursor:pointer}</style><h1>🎸 NILZFRETZ</h1><small>GUITAR & HARMONY EXPLORER</small><p><label>Stimmung <select id="t"><option value="0">Standard E</option><option value="-1">Eb</option><option value="-2">D Standard</option><option value="drop">Drop D</option></select></label><label>Capo <select id="c"></select></label></p><label><input type="checkbox" id="sound" checked> Sound</label><label><input type="checkbox" id="flat"> ♭</label><label><input type="checkbox" id="interval"> Intervalle</label><div id="scroll" style="overflow:auto"><div id="neck"></div></div><small>Seitlich wischen · 0 = Leersaite · Bünde relativ zum Capo</small><div id="result" aria-live="polite"></div><button id="play">▶ Akkord</button> <button id="arp">Arpeggio</button> <button id="clear">Löschen</button><h2>Akkordvarianten</h2><select id="root"></select> <selec const $=id=>document.getElementById(id),mod=n=>(n%12+12)%12,P=[['','Dur',[0,4,7]],['m','Moll',[0,3,7]],['maj7','Major 7',[0,4,7,11]],['7','Dominant 7',[0,4,7,10]],['m7','Moll 7',[0,3,7,10]],['5','Powerchord',[0,7]],['sus2','Sus2',[0,2,7]],['sus4','Sus4',[0,5,7]],['dim','Vermindert',[0,3,6]],['aug','Übermäßig',[0,4,8]],['6','Dur 6',[0,4,7,9]],['m6','Moll 6',[0,3,7,9]],['add9','Add9',[0,2,4,7]],['madd9','Moll Add9',[0,2,3,7]],['m7b5','Halbvermindert',[0,3,6,10]],['dim7','Vermindert 7',[0,3,6,9]],['m(maj7)','Moll Major 7',[0,3,7,11]],['9','Dominant 9',[0,2,4,7,10]],['maj9','Major 9',[0,2,4,7,11]],['m9','Moll 9',[0,2,3,7,10]]];let sel=Array(6).fill(null),all=false,ac,preferred=null;const name=n=>($('flat').checked?['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']:['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'])[mod(n)],base=()=>[40,45,50,55,59,64].map((n,i)=>n+($('t').value==='drop'?(i===0?-2:0):+ $('t').value)+ +$('c').value),max=()=>24-+$('c').value,root=()=>+$('root').value,pat=()=>P[+$('type').value],notes=(v=sel)=>v.flatMap((f,i)=>f===null?[]:[base()[i]+f]).sort((a,b)=>a-b),color=i=>i===0?'#ef6666':[3,4].includes(i)?'#eac58b':[6,7,8].includes(i)?'#69aaf0':[10,11].includes(i)?'#b49aee':'#69cbb0',ints=['1','b2','2','b3','3','4','b5','5','#5','6','b7','7'];
for(let i=0;i<=12;i++)$('c').add(new Option(i?'Bund '+i:'Ohne Capo',i));for(let i=0;i<12;i++)$('root').add(new Option(name(i),i));P.forEach((p,i)=>$('type').add(new Option(p[1],i)));
async function play(ns,delay=.045){if(!ns.length)return;try{ac=ac||new AudioContext();await ac.resume();ns.forEach((n,j)=>{let sr=ac.sampleRate,f=440*2**((n-69)/12),period=Math.max(2,Math.round(sr/f-.5)),buf=ac.createBuffer(1,sr*2,sr),d=buf.getChannelData(0),ring=Float32Array.from({length:period},()=>Math.random()*2-1),k=0;for(let i=0;i<d.length;i++){let v=ring[k];ring[k]=.997*(v+ring[(k+1)%period])/2;k=(k+1)%period;d[i]=v*Math.min(1,(d.length-i)/(sr*.08))}let s=ac.createBufferSource(),g=ac.createGain();s.buffer=buf;g.gain.value=.5/Math.sqrt(ns.length);s.connect(g);g.connect(ac.destination);s.start(ac.currentTime+j*delay)})}catch(e){$('status').textContent='Audio nicht verfügbar'}}
function render(){let ns=notes(),pc=[...new Set(ns.map(mod))],matches=[];for(let r of pc)for(let p of P)if(p[2].length===pc.length&&p[2].every(i=>pc.includes(mod(r+i))))matches.push({r,p});if(preferred)matches.sort((a,b)=>Number(b.r===preferred.r&&b.p===preferred.p)-Number(a.r===preferred.r&&a.p===preferred.p));let m=matches[0],r=all?root():m?m.r:pc[0]??root(),board=$('neck');board.innerHTML='';for(let f=0;f<=24;f++){let d=document.createElement('div');d.textContent=f;board.append(d)}for(let s=5;s>=0;s--)for(let f=0;f<=24;f++){let n=base()[s]+f,i=mod(n-r),on=sel[s]===f&&!all,show=all&&pat()[2].includes(i)&&f<=max(),b=document.createElement('button'),d=document.createElement('span');b.disabled=f>max();b.setAttribute('aria-label',`Saite ${6-s}, Bund ${f}, ${name(n)}`);if(on||show){d.style.background=color(i);d.style.color='#171b21';d.style.fontWeight='bold';d.textContent=$('interval').checked?ints[i]:name(n)}else d.textContent=f===0?name(n):s===3&&[3,5,7,9,12,15,17,19,21,24].includes(f)?'•':'';b.append(d);b.onclick=()=>{if($('sound').checked)play([n]);if(!all){sel[s]=on?null:f;preferred=null;render()}};board.append(b)}let title=all?name(root())+pat()[0]:!ns.length?'–':pc.length===1?name(pc[0]):m?name(m.r)+m.p[0]+(m.r!==pc[0]?'/'+name(pc[0]):''):'Mehrklang';$('result').innerHTML=`<strong style="font-size:32px;color:#eac58b">${title}</strong><div>${all?pat()[1]:!ns.length?'Ton auswählen':pc.length===1?'Einzelton':m?m.p[1]:'Keine eindeutige Zuordnung'}</div><small>${(all?pat()[2].map(i=>root()+i):ns).map(name).join(' · ')}</small>`;if(!all&&matches.length>1)$('result').innerHTML+='<p><small>Auch möglich: '+matches.slice(1).map(x=>name(x.r)+x.p[0]+(x.r!==pc[0]?'/'+name(pc[0]):'')).join(', ')+'</small></p>'}
function variants(){let r=root(),target=pat()[2].map(i=>mod(r+i)),out=[],bs=base();if(pat()[0]===''&&$('t').value!=='drop'){for(let [label,v,sr] of [['C',[null,3,2,0,1,0],0],['A',[null,0,2,2,2,0],9],['G',[3,2,0,0,0,3],7],['E',[0,2,2,1,0,0],4],['D',[null,null,0,2,3,2],2]]){let k=mod(r-sr-+$('t').value-+$('c').value),w=v.map(f=>f===null?null:f+k);if(w.every(f=>f===null||f<=max()))out.push({v:w,pos:k,label:label+'-Form'})}}else{let found=[];for(let start=0;start<=max();start++){let best,score=-Infinity,opts=bs.map(n=>[null,...Array.from({length:Math.min(3,max()-start)+1},(_,i)=>start+i).filter(f=>target.includes(mod(n+f)))]);function rec(v){if(v.length<6){for(let f of opts[v.length])rec([...v,f]);return}let ns=notes(v),pc=new Set(ns.map(mod));if(pc.size!==target.length||!target.every(i=>pc.has(i)))return;let fs=v.filter(f=>f!==null),pressed=fs.filter(f=>f>0),min=Math.min(...pressed),barre=pressed.filter(f=>f===min).length;if(pressed.length>4&&barre<2)return;let sc=fs.length*2+(mod(ns[0])===r?5:0)-(pressed.length?Math.max(...pressed)-min:0);if(sc>score){score=sc;best=v}}rec([]);if(best&&!found.some(o=>String(o.v)===String(best)))found.push({v:best,pos:Math.min(...best.filter(f=>f!==null)),score})}for(let [lo,hi] of [[0,3],[4,7],[8,11],[12,24]]){let g=found.filter(o=>o.pos>=lo&&o.pos<=hi).sort((a,b)=>b.score-a.score);if(g.length)out.push(g[0])}}out.sort((a,b)=>a.pos-b.pos);$('cards').innerHTML='';$('hint').textContent=pat()[0]===''&&$('t').value!=='drop'?'CAGED-Griffformen':'Berechnete Voicings – Greifbarkeit ausprobieren';out.forEach((o,i)=>{let b=document.createElement('button'),fs=o.v.filter(f=>f>0),start=fs.length?Math.min(...fs):1,svg=`<svg viewBox="0 0 130 120" width="100%" style="max-width:150px"><text x="3" y="40" fill="white" font-size="10">${start}.</text>`;for(let s=0;s<6;s++){let x=25+s*17,f=o.v[s];svg+=`<line x1="${x}" x2="${x}" y1="22" y2="107" stroke="#aaa"/>`;if(f===null||f===0)svg+=`<text x="${x}" y="15" text-anchor="middle" fill="white">${f===null?'×':'○'}</text>`}for(let j=0;j<=5;j++)svg+=`<line x1="25" x2="110" y1="${22+j*17}" y2="${22+j*17}" stroke="#aaa"/>`;o.v.forEach((f,s)=>{if(f>0)svg+=`<circle cx="${25+s*17}" cy="${30.5+(f-start)*17}" r="7" fill="${color(mod(bs[s]+f-r))}"/>`});b.innerHTML=`<strong>${o.label||'Variante '+(i+1)}</strong><div>${o.pos?o.pos+'. Bund':'Offene Lage'}</div>${svg}</svg><div>${o.v.map(f=>f===null?'X':f).join(' · ')}</div>▶ Spielen`;b.onclick=()=>{sel=[...o.v];all=false;preferred={r,p:pat()};render();$('scroll').scrollLeft=Math.max(0,(o.pos-1)*44);if($('sound').checked)play(notes())};$('cards').append(b)});if(!out.length)$('cards').textContent='Keine Variante gefunden.'}
$('root').onchange=$('type').onchange=()=>{variants();render()};$('t').onchange=$('c').onchange=()=>{sel=sel.map(f=>f>max()?null:f);preferred=null;if($('t').value==='-1')$('flat').checked=true;refresh()};function refresh(){Array.from($('root').options).forEach((o,i)=>o.textContent=name(i));variants();render()}$('flat').onchange=refresh;$('interval').onchange=render;$('all').onclick=()=>{all=true;render()};$('free').onclick=()=>{all=false;render()};$('clear').onclick=()=>{sel.fill(null);all=false;preferred=null;render()};const playback=()=>all?pat()[2].map(i=>60+root()+i):notes();$('play').onclick=()=>play(playback());$('arp').onclick=()=>play(playback(),.25);refresh();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
